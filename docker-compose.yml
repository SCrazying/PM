version: "3.9"

# PM-System 一键部署（内网单机）
# 使用：
#   1) 前端构建产物放到 frontend/dist（联网机器 npm run build）
#   2) 后端依赖 wheels 放到 backend/wheels（离线时 pip download 生成；在线可留空）
#   3) cp backend/.env.example backend/.env 并修改密钥/数据库密码/AI 配置
#   4) docker compose up -d

services:
  db:
    image: postgres:14
    container_name: pm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pm123}
      POSTGRES_DB: ${POSTGRES_DB:-pm_system}
    volumes:
      - pm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [pm-net]

  backend:
    build: ./backend
    container_name: pm-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-pm}:${POSTGRES_PASSWORD:-pm123}@db:5432/${POSTGRES_DB:-pm_system}
    volumes:
      - pm_uploads:/app/data/uploads
      - pm_backups:/app/data/backups
      - ./db:/app/db:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [pm-net]

  nginx:
    image: nginx:alpine
    container_name: pm-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on: [backend]
    networks: [pm-net]

volumes:
  pm_pgdata:
  pm_uploads:
  pm_backups:

networks:
  pm-net:
    driver: bridge
